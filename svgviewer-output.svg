<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00cc7d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d888;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc7d;stop-opacity:1" />
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="16" cy="16" r="14" fill="url(#mainGradient)" />

  <!-- Decorative Rings -->
  <circle cx="16" cy="16" r="13" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.2" />
  <circle cx="16" cy="16" r="11" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.15" />

  <!-- Accent Lines -->
  <path d="M2 16 L30 16" stroke="url(#accentGradient)" stroke-width="0.5" opacity="0.4" />
  <path d="M16 2 L16 30" stroke="url(#accentGradient)" stroke-width="0.5" opacity="0.4" />

  <!-- NishD Text (Inside the Circle) -->
  <text x="51%" y="52%" text-anchor="middle" dominant-baseline="middle" 
        fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" 
        font-size="8.5" letter-spacing="0.5">
    NishD
  </text>

  <!-- ® Symbol (Outside the Circle) -->
  <text x="85%" y="36%" text-anchor="middle" dominant-baseline="middle" 
        fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" 
        font-size="4">
    ®
  </text>
</svg>
