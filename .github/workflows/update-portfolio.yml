name: Update Portfolio Data

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [created, updated]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-portfolio-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios fs-extra

      - name: Generate portfolio data
        env:
          GITHUB_TOKEN: ${{ secrets.MY_API_KEY }}
          GITHUB_USERNAME: NishDananjaya
        run: node .github/scripts/generate-portfolio-data.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update portfolio data"
          git remote set-url origin https://x-access-token:${{ secrets.MY_API_KEY }}@github.com/NishDananjaya/NishDananjaya.github.io.git
          git push
