name: Update Portfolio Data

on:
  # Run on push to main branch
  push:
    branches: [ main ]
  # Run when a new repository is created or updated
  repository_dispatch:
    types: [created, updated]
  # Run on schedule (once a day)
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight every day
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-portfolio-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios fs-extra

      - name: Generate portfolio data
        env:
          GITHUB_TOKEN: ${{ secrets.MY_API_KEY }}
          GITHUB_USERNAME: NishDananjaya
        run: node .github/scripts/generate-portfolio-data.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update portfolio data"
          git push

