# This GitHub Actions workflow is designed to automate the process of updating GitHub data for a portfolio.
name: Update GitHub Data

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:     # Allows manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run GitHub Data Fetcher
        env:
          GITHUB_TOKEN: ${{ secrets.MY_API_KEY }}
          GITHUB_USERNAME: NishDananjaya
        run: node .github/scripts/generate-portfolio-data.js

      - name: Commit and push updated data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/*.json
          git commit -m "Update GitHub stats and project data" || echo "No changes to commit"
          git push
