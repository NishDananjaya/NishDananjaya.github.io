<!DOCTYPE html>
<html>
<head>
    <title>Technical Skills</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0f0a;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            gap: 2rem;
            padding: 4rem;
            min-height: 100vh;
            width: 100%;
            align-items: center;
            justify-content: center;
        }

        .container::after {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 15, 0, 0.9);
            backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 1;
        }

        .container:has(.card:hover)::after {
            opacity: 1;
        }

        .card-wrapper {
            position: relative;
            width: 300px;
            height: 400px;
            z-index: 2;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 25, 0, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(0, 255, 0, 0.1);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
            cursor: pointer;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, 
                rgba(0, 255, 0, 0.15),
                transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
            border-radius: 20px;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-wrapper:hover .card {
            transform: scale(1.2);
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1.2);
            background: rgba(0, 35, 0, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }

        .container:has(.card:hover) .card-wrapper:not(:hover) .card {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        .card-content {
            padding: 2rem;
            color: #e0ffe0;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .card p {
            color: #a0ffa0;
            opacity: 0.8;
        }

        .tools {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            pointer-events: none;
            z-index: 3;
        }

        .tool {
            position: absolute;
            padding: 1rem 2rem;
            background: rgba(0, 25, 0, 0.9);
            color: #00ff00;
            border-radius: 50px;
            transform: scale(0) translate(-50%, -50%);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.2);
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(0, 255, 0, 0.2);
        }

        .card-wrapper:hover .tool {
            opacity: 1;
            transform: scale(1) translate(-50%, -50%);
            transition-delay: calc(var(--index) * 0.1s);
            cursor: pointer;
        }

        /* Position tools in a perfect circle */
        .card-wrapper:hover .tool:nth-child(1) { 
            --index: 0;
            transform: translate(calc(-50% + 0px), calc(-50% - 250px)) scale(1); 
        }
        .card-wrapper:hover .tool:nth-child(2) { 
            --index: 1;
            transform: translate(calc(-50% + 238px), calc(-50% - 77px)) scale(1); 
        }
        .card-wrapper:hover .tool:nth-child(3) { 
            --index: 2;
            transform: translate(calc(-50% + 147px), calc(-50% + 203px)) scale(1); 
        }
        .card-wrapper:hover .tool:nth-child(4) { 
            --index: 3;
            transform: translate(calc(-50% - 147px), calc(-50% + 203px)) scale(1); 
        }
        .card-wrapper:hover .tool:nth-child(5) { 
            --index: 4;
            transform: translate(calc(-50% - 238px), calc(-50% - 77px)) scale(1); 
        }

        .tool:hover {
            background: rgba(0, 35, 0, 1);
            transform: translate(-50%, -50%) scale(1.1) !important;
            box-shadow: 0 8px 20px rgba(0, 255, 0, 0.3);
        }

        .tool i {
            font-size: 1.2rem;
            color: #00ff00;
        }

        .back-button {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 1rem 2rem;
            background: rgba(0, 25, 0, 0.9);
            color: #00ff00;
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 50px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.2);
        }

        .back-button:hover {
            background: rgba(0, 35, 0, 1);
            box-shadow: 0 8px 20px rgba(0, 255, 0, 0.3);
        }

        .container:has(.card:hover) .back-button {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <button class="back-button">
            <i class="fas fa-arrow-left"></i>
            Back to Overview
        </button>
        
        <div class="card-wrapper">
            <div class="card" data-category="embedded">
                <div class="card-content">
                    <div class="card-icon">🔧</div>
                    <h2>Embedded Systems</h2>
                    <p>Hardware and firmware development</p>
                </div>
            </div>
            <div class="tools">
                <span class="tool"><i class="fas fa-microchip"></i> ARM Cortex</span>
                <span class="tool"><i class="fas fa-cogs"></i> Arduino</span>
                <span class="tool"><i class="fas fa-desktop"></i> Raspberry Pi</span>
                <span class="tool"><i class="fas fa-wifi"></i> ESP32</span>
                <span class="tool"><i class="fas fa-microchip"></i> PIC</span>
            </div>
        </div>
        
        <div class="card-wrapper">
            <div class="card" data-category="ai">
                <div class="card-content">
                    <div class="card-icon">🤖</div>
                    <h2>Artificial Intelligence</h2>
                    <p>Machine learning and deep learning</p>
                </div>
            </div>
            <div class="tools">
                <span class="tool"><i class="fas fa-brain"></i> TensorFlow</span>
                <span class="tool"><i class="fas fa-project-diagram"></i> PyTorch</span>
                <span class="tool"><i class="fas fa-chart-line"></i> Scikit-learn</span>
                <span class="tool"><i class="fas fa-eye"></i> OpenCV</span>
                <span class="tool"><i class="fas fa-language"></i> NLTK</span>
            </div>
        </div>
        
        <div class="card-wrapper">
            <div class="card" data-category="programming">
                <div class="card-content">
                    <div class="card-icon">💻</div>
                    <h2>Programming</h2>
                    <p>Software development expertise</p>
                </div>
            </div>
            <div class="tools">
                <span class="tool"><i class="fab fa-python"></i> Python</span>
                <span class="tool"><i class="fab fa-js"></i> JavaScript</span>
                <span class="tool"><i class="fab fa-cuttlefish"></i> C++</span>
                <span class="tool"><i class="fab fa-java"></i> Java</span>
                <span class="tool"><i class="fab fa-google"></i> Go</span>
            </div>
        </div>
    </div>

    <script>
        // Back button functionality
        document.querySelector('.back-button').addEventListener('click', () => {
            const activeCard = document.querySelector('.card-wrapper:hover');
            if (activeCard) {
                activeCard.querySelector('.card').style.transform = 'scale(1)';
                activeCard.querySelector('.card').style.pointerEvents = 'none';
                setTimeout(() => {
                    activeCard.querySelector('.card').style.pointerEvents = 'auto';
                }, 100);
            }
        });
    </script>
</body>
</html>
